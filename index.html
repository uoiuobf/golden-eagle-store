<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Eagle Store</title>

  <!-- أيقونة الموقع Favicon -->
  <link rel="icon" href="image/Golden Eagle.jpg" type="image/jpeg">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Animated Background -->
<div class="bg-animation" id="bgAnimation"></div>

<!-- Header -->
<header class="header">
  <div class="container header-container">

    <div class="logo" style="display: flex; align-items: center; gap: 12px;">
      <img src="image/Golden Eagle.jpg" alt="Golden Eagle Logo" style="width: 45px; height: 45px; border-radius: 8px; border: 1px solid var(--primary);">
      <div>
        <h1>Golden Eagle Store</h1>
        <span>متجر الألعاب الأول في مصر</span>
      </div>
    </div>

    <div class="header-actions">

      <button class="icon-btn">
        <i class="far fa-heart"></i>
        <span class="badge">3</span>
      </button>

      <button class="icon-btn" onclick="toggleCart()">
        <i class="fas fa-shopping-cart"></i>
        <span id="cartCount" class="badge">0</span>
      </button>

      <button class="login-btn" onclick="openLogin()" id="loginButton">
        <i class="fas fa-user"></i>
        تسجيل الدخول
      </button>

    </div>

  </div>
</header>

<!-- Hero Section -->
<section class="hero">
  <div class="hero-content">
    <span class="hero-badge">🔥 الأكثر انتظاراً</span>
    <h2>Grand Theft Auto VI - الإصدار الأسطوري</h2>
    <p>انطلق في مغامرة لا مثيل لها في عالم مفتوح مذهل واكتشف مدينة Vice City بتفاصيل غير مسبوقة.</p>

    <div class="hero-buttons">
      <button class="btn-primary">قريباً</button>
      <button class="btn-secondary">شاهد العرض</button>
    </div>
  </div>

  <div class="hero-image">
    <img src="image/gta-vi.jpg" alt="GTA VI">
  </div>
</section>

<!-- Login Modal -->
<div class="login-modal" id="loginModal">
  <div class="login-box">

    <h3>تسجيل الدخول</h3>

    <input type="text" id="usernameInput" placeholder="اسم المستخدم">
    <input type="password" id="passwordInput" placeholder="كلمة المرور">

    <button onclick="loginUser()">دخول</button>
    <button class="close-btn" onclick="closeLogin()">إغلاق</button>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
